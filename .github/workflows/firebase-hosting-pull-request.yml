# Deploy preview to Firebase Hosting on pull request
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Create .env.local from DOT_ENV secret
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          if [ -n "$DOT_ENV" ]; then
            echo "$DOT_ENV" > .env.local
          fi
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOWELSHOPAPP }}
          projectId: towelshopapp
