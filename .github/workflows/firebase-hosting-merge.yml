# Deploy to Firebase Hosting on merge
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Create .env.local from DOT_ENV secret
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          if [ -n "$DOT_ENV" ]; then
            echo "$DOT_ENV" > .env.local
          fi
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOWELSHOPAPP }}
          channelId: live
          projectId: towelshopapp
